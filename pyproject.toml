[project]
name = "check-hashes"
version = "1.0.0"
description = "Check pwdump hashes for shared passwords and broken separation of privilege"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
check-hashes = "check_hashes.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/check_hashes"]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
